# /etc/nginx/sites-available/nanoskop  (change server_name and certificate paths)
server {
    listen 80;
    server_name nanoskop.example.gov.tr;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name nanoskop.example.gov.tr;
    ssl_certificate     /etc/ssl/certs/nanoskop.crt;
    ssl_certificate_key /etc/ssl/private/nanoskop.key;

    client_max_body_size 300m;      # admin CSV upload; own files are smaller
    proxy_read_timeout 300s;        # analysing an uploaded file can take a while

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
